[pytest]
# Pytest Configuration - Profesyonel Test Mimarisi
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --verbose
    --strict-markers
    --tb=short
    --maxfail=5
    --disable-warnings

markers =
    unit: Unit tests - isolated component tests
    integration: Integration tests - component interaction tests
    regression: Regression tests - bug fix validation
    e2e: End-to-end tests - full system tests
    slow: Slow tests
    fast: Fast tests
    performance: Performance tests
    auth: Authentication related tests
    db: Database related tests
    api: API related tests
    ui: UI related tests
    financial: Financial calculation tests
    security: Security related tests
    forensic: Forensic and raw API verification tests

[coverage:run]
source = .
branch = True
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*
    */virtualenv/*
    */.tox/*
    */node_modules/*
    */dist/*
    */build/*
    setup.py
    pythonanywhere_wsgi.py
    */admin_demo_data.py
    */advanced_demo_data_generator.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov
