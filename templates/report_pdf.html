<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    @page { size: A4; margin: 1.5cm; }
    body { font-family: 'Arial', sans-serif; font-size: var(--font-size-10, 10px); color: var(--c, #333); }
    h1 { color: var(--c, #1F4E78); text-align: center; border-bottom: 2px solid var(--c, #1F4E78); padding-bottom: 10px; font-family: 'Arial', sans-serif; }
    h2 { color: var(--c, #C00); font-size: var(--font-size-14, 14px); margin-top: 20px; font-family: 'Arial', sans-serif; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { background-color: var(--c, #EEE); padding: var(--space-pad-8, 8px); text-align: left; border: 1px solid var(--c, #CCC); font-family: 'Arial', sans-serif; }
    td { padding: var(--space-pad-8, 8px); border: 1px solid var(--c, #DDD); font-family: 'Arial', sans-serif; }
    .amount { text-align: right; font-weight: bold; }
    .footer { position: fixed; bottom: 0; width: 100%; text-align: center; font-size: var(--font-size-8, 8px); color: var(--c, #999); font-family: 'Arial', sans-serif; }
</style>
</head>
<body>
    <h1>{{ _('ui_auto_34ae42be4f62') }}</h1>
    <h2>{{ title }}</h2>
    <p>Rapor Tarihi: {{ today }}</p>
    <table>
        <thead><tr><th>TARIH</th><th>KATEGORI</th><th>ACIKLAMA</th><th class="text-right">TUTAR</th></tr></thead>
        <tbody>
            {% for t in transactions %}
            <tr>
                <td>{{ t.date }}</td><td>{{ t.category }}</td><td>{{ t.description }}</td>
                <td class="amount">{{ t.amount }} TL</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div class="footer">{{ _('ui_auto_241b10e41e78') }}</div>
</body>
</html>
