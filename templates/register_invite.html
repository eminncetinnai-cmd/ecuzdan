<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('ui_auto_fd53f42c2162') }}</title>
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--c, #667eea) 0%, var(--c, #764ba2) 100%);
            padding: var(--space-pad-20, 20px);
        }

        .auth-card {
            background: white;
            border-radius: var(--border-radius-10, 10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: var(--space-pad-40, 40px);
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: var(--c, #333);
            font-size: var(--font-size-28, 28px);
            margin-bottom: 10px;
        }

        .auth-header p {
            color: var(--c, #666);
            font-size: var(--font-size-14, 14px);
        }

        .auth-form .form-group {
            margin-bottom: 20px;
        }

        .auth-form label {
            display: block;
            margin-bottom: 8px;
            color: var(--c, #333);
            font-weight: 500;
        }

        .auth-form input {
            width: 100%;
            padding: var(--space-pad-12, 12px);
            border: 1px solid var(--c, #ddd);
            border-radius: var(--border-radius-5, 5px);
            font-size: var(--font-size-14, 14px);
            transition: border-color 0.3s;
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--c, #667eea);
        }

        .auth-form input[readonly] {
            background-color: var(--c, #f5f5f5);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--c, #eee);
        }

        .auth-footer p {
            color: var(--c, #666);
            font-size: var(--font-size-14, 14px);
        }

        .auth-footer a {
            color: var(--c, #667eea);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: var(--space-pad-12, 12px);
            border-radius: var(--border-radius-5, 5px);
            margin-bottom: 20px;
            font-size: var(--font-size-14, 14px);
        }

        .alert-error {
            background-color: var(--c, #fee);
            color: var(--c, #c33);
            border: 1px solid var(--c, #fcc);
        }

        .alert-success {
            background-color: var(--c, #efe);
            color: var(--c, #3c3);
            border: 1px solid var(--c, #cfc);
        }

        .alert-warning {
            background-color: var(--c, #ffd);
            color: var(--c, #963);
            border: 1px solid var(--c, #fc6);
        }

        .btn {
            width: 100%;
            padding: var(--space-pad-12, 12px);
            background: linear-gradient(135deg, var(--c, #667eea) 0%, var(--c, #764ba2) 100%);
            color: white;
            border: none;
            border-radius: var(--border-radius-5, 5px);
            font-size: var(--font-size-16, 16px);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--c, #5568d3) 0%, var(--c, #653a91) 100%);
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>{{ _('ui_auto_8a28c1ab5c0f') }}</h1>
            <p>{{ email }} adresine davet edildiniz</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('auth.register_with_invite', token=token) }}" class="auth-form">
            <div class="form-group">
                <label for="full_name">{{ _('ui_auto_e5f443596bf3') }}</label>
                <input type="text" id="full_name" name="full_name" required 
                       placeholder="{{ _('ui_auto_bedd20d8156c') }}">
            </div>
            
            <div class="form-group">
                <label for="email">{{ _('ui_auto_0ff610ba0319') }}</label>
                <input type="email" id="email" name="email" value="{{ email }}" readonly
                       class="bg-slate-50">
            </div>
            
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" required 
                       placeholder="En az 8 karakter" minlength="8">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Şifre Tekrar</label>
                <input type="password" id="confirm_password" name="confirm_password" required 
                       placeholder="{{ _('ui_auto_ffe5183c9c56') }}" minlength="8">
            </div>
            
            <button data-macro="button_secondary" type="submit" class="btn">{{ _('ui_auto_f5a9d896cfa6') }}</button>
        </form>
        
        <div class="auth-footer">
            <p>{{ _('ui_auto_117e7c6e9b8b') }} <a href="{{ url_for('auth.login') }}">Giriş Yap</a></p>
        </div>
    </div>
</div>
</body>
</html>
