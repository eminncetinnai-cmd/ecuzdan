<!-- Global Hızlı İşlem Modal Widget -->
<div id="globalQuickTxModal" class="edit-modal hidden">
    <div class="edit-modal-backdrop" onclick="closeGlobalQuickTxModal()"></div>
    <div class="edit-modal-content">
        <div class="edit-modal-card">
            <div class="edit-modal-header">
                <div class="modal-header-actions">
                    <div class="modal-header-left">
                        <div class="modal-icon modal-icon-sky">
                            <svg class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-black text-slate-900 uppercase tracking-tight">{{ _('nav_quick_transaction') }}</h3>
                            <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">{{ _('nav_quick_transaction_description') }}</p>
                        </div>
                    </div>
                    <button data-macro="button_secondary" type="button" onclick="closeGlobalQuickTxModal()" class="modal-close">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>

            <form id="globalQuickTxForm" class="edit-modal-body space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- 1-Click Akıllı Şablonlar -->
                <div>
                    <label class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Hızlı Şablonlar</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button data-macro="button_secondary" type="button" onclick="setQuickTxPreset('Gider', 'Market', 'Market Alışverişi')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-50 text-amber-700 dark:bg-amber-950/40 dark:text-amber-300 border border-amber-200/60 dark:border-amber-800/60 hover:bg-amber-100 dark:hover:bg-amber-900/40 transition cursor-pointer">Market 🛒</button>
                        <button data-macro="button_secondary" type="button" onclick="setQuickTxPreset('Gider', 'Yemek', 'Yemek / Restoran')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-orange-50 text-orange-700 dark:bg-orange-950/40 dark:text-orange-300 border border-orange-200/60 dark:border-orange-800/60 hover:bg-orange-100 dark:hover:bg-orange-900/40 transition cursor-pointer">Yemek 🍽️</button>
                        <button data-macro="button_secondary" type="button" onclick="setQuickTxPreset('Gider', 'Fatura', 'Fatura Ödemesi')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-50 text-rose-700 dark:bg-rose-950/40 dark:text-rose-300 border border-rose-200/60 dark:border-rose-800/60 hover:bg-rose-100 dark:hover:bg-rose-900/40 transition cursor-pointer">Fatura ⚡</button>
                        <button data-macro="button_secondary" type="button" onclick="setQuickTxPreset('Gider', 'Ulaşım', 'Ulaşım / Akaryakıt')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-50 text-sky-700 dark:bg-sky-950/40 dark:text-sky-300 border border-sky-200/60 dark:border-sky-800/60 hover:bg-sky-100 dark:hover:bg-sky-900/40 transition cursor-pointer">Ulaşım 🚗</button>
                        <button data-macro="button_secondary" type="button" onclick="setQuickTxPreset('Gelir', 'Maaş', 'Aylık Maaş')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 border border-emerald-200/60 dark:border-emerald-800/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/40 transition cursor-pointer">Maaş 💰</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-2">{{ _('tx_filter_type') }}</label>
                        <select id="globalQuickTxFlowType" class="edit-modal-input font-bold" onchange="updateGlobalQuickTxCategory()" required>
                            <option value="Gider">{{ _('tx_type_expense') }} ({{ _('expense_outflow') }})</option>
                            <option value="Gelir">{{ _('tx_type_income') }} ({{ _('income_inflow') }})</option>
                            <option value="Yatırım">{{ _('tx_type_investment') }} ({{ _('investment_transfer') }})</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-2">{{ _('tx_category_label') }}</label>
                        <select name="category" id="globalQuickTxCategory" class="edit-modal-input font-bold" required>
                            <!-- JS ile doldurulacak -->
                        </select>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-[9px] font-bold text-slate-400 uppercase">{{ _('tx_description_label') }}</label>
                        <div class="flex items-center gap-2.5">
                            <button data-macro="button_secondary" type="button" onclick="pasteAndParseBankSMS()" class="text-[10px] font-bold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1 cursor-pointer" title="Kopyalanan banka SMS'ini ayrıştır">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                                <span>SMS Yapıştır</span>
                            </button>
                            <button data-macro="button_secondary" type="button" id="btnVoiceTxMic" onclick="toggleVoiceTxInput()" class="text-[10px] font-bold text-rose-600 dark:text-rose-400 hover:underline flex items-center gap-1 cursor-pointer" title="Sesle söyleyerek harcama girin">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                <span id="voiceMicLabel">Sesle Söyle</span>
                            </button>
                        </div>
                    </div>
                    <input type="text" name="description" id="globalQuickTxDesc" placeholder="{{ _('tx_description_placeholder') }}" class="edit-modal-input" required>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="text-[9px] font-bold text-slate-400 uppercase">{{ _('tx_amount_label') }}</label>
                        </div>
                        <input type="number" step="0.01" min="0.01" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" name="amount" id="globalQuickTxAmount" placeholder="0.00" class="edit-modal-input font-bold text-sky-700 dark:text-sky-400" required>
                        <!-- Hızlı Tutar Çipleri -->
                        <div class="flex flex-wrap gap-1 mt-1.5">
                            <button data-macro="button_secondary" type="button" onclick="setQuickTxAmount(100)" class="px-2 py-1 min-h-[30px] rounded text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">+100</button>
                            <button data-macro="button_secondary" type="button" onclick="setQuickTxAmount(250)" class="px-2 py-1 min-h-[30px] rounded text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">+250</button>
                            <button data-macro="button_secondary" type="button" onclick="setQuickTxAmount(500)" class="px-2 py-1 min-h-[30px] rounded text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">+500</button>
                            <button data-macro="button_secondary" type="button" onclick="setQuickTxAmount(1000)" class="px-2 py-1 min-h-[30px] rounded text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">+1k</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-2">{{ _('tx_date_label') }}</label>
                        <input type="date" name="date" id="globalQuickTxDate" class="edit-modal-input" required>
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-2">{{ _('tx_status_label') }}</label>
                        <select name="status" class="edit-modal-input font-bold" required>
                            <option value="Ödendi">{{ _('tx_status_paid') }}</option>
                            <option value="Bekliyor">{{ _('tx_status_pending') }}</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[9px] font-bold text-slate-400 uppercase block mb-2">{{ _('tx_note_label') }}</label>
                    <input type="text" name="note" placeholder="{{ _('tx_note_placeholder') }}" class="edit-modal-input">
                </div>

                <div class="modal-footer">
                    <button data-macro="button_primary" type="submit" class="modal-submit modal-submit-sky">
                        {{ _('tx_save_btn') }}
                    </button>
                    <button data-macro="button_secondary" type="button" onclick="closeGlobalQuickTxModal()" class="modal-cancel">
                        {{ _('tx_cancel_btn') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
