<!-- Global Face ID / Biyometrik Kilit Ekranı -->
<div id="biometricLockModal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950/85 backdrop-blur-2xl transition-opacity duration-300">
    <div class="max-w-sm w-full mx-4 p-5 sm:p-8 rounded-2xl sm:rounded-3xl bg-white/95 dark:bg-slate-900/95 border border-slate-200 dark:border-slate-800 shadow-2xl text-center flex flex-col items-center">
        <!-- Vault & Face ID Icon Combo -->
        <div class="relative w-24 h-24 mb-6 flex items-center justify-center">
            <div class="absolute inset-0 rounded-3xl bg-indigo-500/20 animate-ping"></div>
            <div class="relative w-20 h-20 rounded-2xl bg-gradient-to-tr from-indigo-600 to-sky-500 text-white flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11m0 0a8 8 0 001.328 4.414"/>
                </svg>
            </div>
        </div>

        <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight mb-2">
            Kasa Kilitli
        </h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium mb-6 leading-relaxed">
            Finansal verilerinizi korumak için Face ID veya Touch ID ile doğrulama yapın.
        </p>

        <button data-macro="button_primary" id="btnBiometricUnlock" type="button" onclick="if(window.ECuzdanBiometrics) window.ECuzdanBiometrics.verify();" class="w-full py-3.5 px-6 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-600/30 active:scale-95 transition cursor-pointer flex items-center justify-center gap-2 mb-3">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            <span>Face ID ile Aç</span>
        </button>

        <a href="/logout" class="text-xs font-bold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
            Şifre ile Giriş Yap →
        </a>
    </div>
</div>
