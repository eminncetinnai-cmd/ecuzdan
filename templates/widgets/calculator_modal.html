<!-- Calculator Modal Widget -->
<div id="calculatorModal" class="modal-overlay hidden fixed inset-0 z-[9999] flex items-center justify-center">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeCalculator()"></div>
    <div class="relative bg-white dark:bg-slate-900 rounded-3xl shadow-2xl p-4 sm:p-6 lg:p-8 max-w-md w-full mx-4 border border-slate-100 dark:border-slate-800 transform transition-all z-10">
        <div class="flex items-center justify-between mb-6">
            <h3 class="font-black text-slate-900 dark:text-white text-xl uppercase tracking-tight">{{ _('calculator_title') }}</h3>
            <button data-macro="button_secondary" type="button" onclick="closeCalculator()" class="p-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition">
                <svg class="w-6 h-6 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Calculator Display -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 mb-6 shadow-inner border border-slate-800">
            <div id="calculatorHistory" class="text-right text-slate-400 text-base font-mono tracking-wider overflow-hidden h-8 mb-2"></div>
            <div id="calculatorDisplay" class="text-right text-white text-4xl font-bold font-mono tracking-wider overflow-hidden">0</div>
        </div>

        <!-- Calculator Buttons -->
        <div class="grid grid-cols-4 gap-3">
            <button data-macro="button_secondary" type="button" onclick="calculatorClear()" class="col-span-2 py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white transition-all shadow-lg hover:shadow-xl transform hover:scale-105 active:scale-95">C</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorBackspace()" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-200 to-slate-300 dark:from-slate-700 dark:to-slate-800 hover:from-slate-300 hover:to-slate-400 dark:hover:from-slate-600 dark:hover:to-slate-700 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">⌫</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorOperator('/')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-sky-500 to-sky-600 hover:from-sky-600 hover:to-sky-700 text-white transition-all shadow-lg hover:shadow-xl transform hover:scale-105 active:scale-95">÷</button>

            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('7')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">7</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('8')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">8</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('9')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">9</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorOperator('*')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-sky-500 to-sky-600 hover:from-sky-600 hover:to-sky-700 text-white transition-all shadow-lg hover:shadow-xl transform hover:scale-105 active:scale-95">×</button>

            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('4')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">4</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('5')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">5</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('6')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">6</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorOperator('-')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-sky-500 to-sky-600 hover:from-sky-600 hover:to-sky-700 text-white transition-all shadow-lg hover:shadow-xl transform hover:scale-105 active:scale-95">−</button>

            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('1')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">1</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('2')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">2</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('3')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">3</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorOperator('+')" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-sky-500 to-sky-600 hover:from-sky-600 hover:to-sky-700 text-white transition-all shadow-lg hover:shadow-xl transform hover:scale-105 active:scale-95">+</button>

            <button data-macro="button_secondary" type="button" onclick="calculatorNumber('0')" class="col-span-2 py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">0</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorDecimal()" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-700 dark:hover:to-slate-600 text-slate-700 dark:text-slate-200 transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95">.</button>
            <button data-macro="button_secondary" type="button" onclick="calculatorEquals()" class="py-3.5 sm:py-5 rounded-xl sm:rounded-2xl font-bold text-lg uppercase bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white transition-all shadow-lg hover:shadow-xl transform hover:scale-105 active:scale-95">=</button>
        </div>
    </div>
</div>
