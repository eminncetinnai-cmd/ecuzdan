{% extends 'layout.html' %}

{% block title %}Bildirimler | {{ brand }}{% endblock %}

{% block content %}
<div class="notifications-page">
    <div class="page-header">
        <div class="page-header-content">
            <div class="page-title-area">
                <div class="page-icon">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="page-title">Bildirimler</h1>
                    <p class="page-subtitle">Tüm bildirimlerinizi buradan yönetebilirsiniz</p>
                </div>
            </div>
            <div class="page-actions">
                <button type="button" onclick="markAllRead()" class="btn btn-secondary btn-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M5 13l4 4L19 7"></path>
                    </svg>
                    Tümünü Okundu İşaretle
                </button>
                <button type="button" onclick="deleteAllRead()" class="btn btn-danger btn-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    Okunmuşları Sil
                </button>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filters-left">
            <div class="filter-group">
                <label class="filter-label">Durum</label>
                <select id="filterStatus" class="filter-select" onchange="applyFilters()">
                    <option value="all">Tümü</option>
                    <option value="unread">Okunmamış</option>
                    <option value="read">Okunmuş</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Önem</label>
                <select id="filterSeverity" class="filter-select" onchange="applyFilters()">
                    <option value="all">Tümü</option>
                    <option value="danger">Kritik</option>
                    <option value="warning">Uyarı</option>
                    <option value="info">Bilgi</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Kategori</label>
                <select id="filterCategory" class="filter-select" onchange="applyFilters()">
                    <option value="all">Tümü</option>
                    <option value="budget">Bütçe</option>
                    <option value="transaction">İşlem</option>
                    <option value="recurring_plan">Düzenli Plan</option>
                    <option value="asset">Varlık</option>
                    <option value="system">Sistem</option>
                </select>
            </div>
        </div>
        <div class="filters-right">
            <div class="search-box">
                <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Bildirim ara..." onkeyup="applyFilters()">
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-label">Toplam</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Okunmamış</div>
            <div class="stat-value stat-value-danger" id="statUnread">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Kritik</div>
            <div class="stat-value stat-value-danger" id="statDanger">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Uyarı</div>
            <div class="stat-value stat-value-warning" id="statWarning">0</div>
        </div>
    </div>

    <!-- Notifications List -->
    <div class="notifications-list" id="notificationsList">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Bildirimler yükleniyor...</p>
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination-bar" id="paginationBar" style="display: none;">
        <div class="pagination-info">
            <span id="paginationInfo">Toplam 0 bildirim</span>
        </div>
        <div class="pagination-controls">
            <button type="button" class="pagination-btn" onclick="prevPage()" id="prevBtn" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <span class="pagination-pages" id="paginationPages">1 / 1</span>
            <button type="button" class="pagination-btn" onclick="nextPage()" id="nextBtn" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/notifications-page.js') }}"></script>
{% endblock %}
