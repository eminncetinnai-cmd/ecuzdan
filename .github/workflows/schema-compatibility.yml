name: Schema Compatibility Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'models/**'
      - 'infrastructure/database/**'
      - 'infrastructure/backup/**'
      - 'database/schema_version.py'

jobs:
  schema-compatibility:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run schema compatibility tests
      run: |
        pytest tests/integration/test_schema_compatibility.py -v --tb=short
    
    - name: Check schema version change
      run: |
        python scripts/check_schema_version.py
    
    - name: Generate schema compatibility report
      if: always()
      run: |
        python scripts/generate_schema_report.py > schema_report.txt
    
    - name: Upload schema report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: schema-compatibility-report
        path: schema_report.txt