name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-flask pytest-xdist pytest-timeout

      - name: Check log PII policy
        run: python scripts/check_log_pii.py

      - name: Verify database schema
        run: python scripts/verify_database_schema.py
        env:
          DISABLE_BACKGROUND_SERVICE: 'true'

      - name: Verify observability configuration
        run: python scripts/verify_observability.py
        env:
          DISABLE_BACKGROUND_SERVICE: 'true'

      - name: Run fast tests with coverage
        run: |
          pytest tests/ -m "not slow" -n 4 --dist=loadscope --timeout=180 --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing --benchmark-disable

      - name: Run slow tests with timeout
        run: |
          pytest tests/ -m slow --timeout=300 --no-cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
