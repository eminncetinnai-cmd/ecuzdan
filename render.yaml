services:
  - type: web
    name: ecuzdan
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: "production"
      - key: HTTPS_ENABLED
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BACKGROUND_SERVICE_ENABLED
        value: "true"
      - key: BACKGROUND_WORKER_OWNER
        value: "web"
      - key: ALLOW_SINGLE_INSTANCE_RATELIMIT
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: "memory://"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
