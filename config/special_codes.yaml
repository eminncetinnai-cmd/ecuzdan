# Special Codes Configuration
# This file defines special codes that can be used to upgrade user roles
# World-standard approach for invitation/promo code systems

codes:
  emincetin10:
    role: "sistem_yoneticisi"
    description: "Full system administrator with all permissions"
    max_uses: 1
    expires_at: null
    tenant_specific: false
    metadata:
      granted_by: "system"
      notes: "Super admin access code"

