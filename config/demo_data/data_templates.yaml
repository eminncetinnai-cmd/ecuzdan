    base_quantity: 100
    quantity_range:
      min: 50
      max: 500
    base_price: 285
    price_range:
      min: 200
      max: 400
    currency: "TRY"
    risk_level: "Orta"
    liquidity: "Likit"
    sync_cash: true
  
