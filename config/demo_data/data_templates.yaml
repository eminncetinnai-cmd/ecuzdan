# Data Templates for Demo Data Generation
# Predefined templates for common transaction patterns

transaction_templates:
  monthly_salary:
    name: "Aylık Maaş {year}"
    category_mapping: "salary"
    description_template: "{year}-{month} maaş ödemesi"
    amount_rule: "salary"
    frequency: "monthly"
    day: 15
    type: "Gelir"
  
  monthly_rent_income:
    name: "Kira Geliri {year}"
    category_mapping: "rent_income"
    description_template: "{year}-{month} kira geliri"
    amount_rule: "rent_income"
    frequency: "monthly"
    day: 1
    type: "Gelir"
  
  quarterly_dividend:
    name: "Çeyrek Faiz Geliri {year}"
    category_mapping: "interest_income"
    description_template: "Çeyrek dönem faiz geliri"
    amount_rule: "interest_income"
    frequency: "quarterly"
    day: 1
    months: [3, 6, 9, 12]
    type: "Gelir"
  
  extra_income:
    name: "Ek Gelir"
    category_mapping: "extra_income"
    description_template: "Ek proje geliri"
    amount_rule: "extra_income"
    frequency: "bi_monthly"
    day_range: [5, 25]
    type: "Gelir"
  
  monthly_rent_expense:
    name: "Konut Kirası"
    category_mapping: "monthly_fixed"
    description_template: "Konut kirası"
    amount_rule: "monthly_fixed"
    frequency: "monthly"
    day: 3
    type: "Gider"
  
  credit_card_payment:
    name: "Kredi Kartı Ödemesi"
    category_mapping: "credit_card_payment"
    description_template: "Kredi kartı ödemesi"
    amount_rule: "credit_card_payment"
    frequency: "monthly"
    day: 12
    type: "Gider"
  
  credit_payment:
    name: "Kredi Taksidi"
    category_mapping: "credit_payment"
    description_template: "Banka kredisi taksiti"
    amount_rule: "credit_payment"
    frequency: "monthly"
    day: 22
    type: "Gider"

recurring_plan_templates:
  salary_plan:
    name: "Maaş Planı"
    category_mapping: "salary"
    amount_rule: "salary"
    installments: 12
    payment_day: 1
    note_template: "{year} Admin — düzenli maaş"
    type: "Gelir"
  
  rent_income_plan:
    name: "Kira Geliri Planı"
    category_mapping: "rent_income"
    amount_rule: "rent_income"
    installments: 12
    payment_day: 1
    note_template: "{year} Admin — kira geliri"
    type: "Gelir"
  
  rent_expense_plan:
    name: "Konut Kirası"
    category_mapping: "monthly_fixed"
    amount_rule: "monthly_fixed"
    installments: 12
    payment_day: 3
    note_template: "{year} Admin — konut kirası"
    type: "Gider"
  
  credit_plan:
    name: "Konut Kredisi"
    category_mapping: "credit_payment"
    amount_rule: "credit_payment"
    installments: 12
    payment_day: 10
    note_template: "{year} Admin — konut kredisi"
    type: "Gider"
  
  credit_card_plan:
    name: "Kredi Kartı Limit"
    category_mapping: "credit_card_payment"
    amount_rule: "credit_card_payment"
    installments: 12
    payment_day: 15
    note_template: "{year} Admin — kart ödemesi"
    type: "Gider"
  
  investment_plan:
    name: "Aylık Yatırım"
    category_mapping: "cash_deposit"
    amount_rule: "cash_deposit"
    installments: 12
    payment_day: 10
    note_template: "Aylık yatırım {year}"
    type: "Yatırım"

asset_templates:
  stock:
    type: "Hisse Senedi"
