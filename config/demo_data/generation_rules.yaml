# Generation Rules for Demo Data
# Defines amount ranges, frequency, and patterns for different transaction types

income_rules:
  salary:
    base_amount: 50000
    amount_range:
      min: 45000
      max: 55000
    variation_percent: 0.10  # ±10% variation
    frequency: "monthly"
    payment_day: 15
    status_distribution:
      Ödendi: 0.90
      Gecikti: 0.10
  
  extra_income:
    base_amount: 8000
    amount_range:
      min: 6000
      max: 10000
