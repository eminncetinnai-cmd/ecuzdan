<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Metallic Violet to Indigo Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Metallic Gold to Amber Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Glass Overlay -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="42" fill="url(#primary-grad)" opacity="0.25" filter="url(#neon-glow)" />

  <!-- Master Shield/Wallet Outer Hexagon-Squircle -->
  <rect x="15" y="15" width="90" height="90" rx="28" fill="url(#primary-grad)" />
  <rect x="15" y="15" width="90" height="90" rx="28" fill="url(#glass-glare)" />
  <rect x="15.5" y="15.5" width="89" height="89" rx="27.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />

  <!-- Inner Dynamic Modern Wallet Flap / Node Arc -->
  <path d="M 28 42 C 28 32, 38 24, 60 24 C 82 24, 92 32, 92 42 L 92 78 C 92 88, 82 96, 60 96 C 38 96, 28 88, 28 78 Z" fill="#0b0f19" opacity="0.88" />
  
  <!-- Stylized Infinity / Geometric Fold Arc -->
  <path d="M 38 48 C 38 40, 48 35, 60 35 C 72 35, 82 40, 82 48 C 82 58, 60 62, 60 74" fill="none" stroke="url(#gold-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Lira Symbol & Digital Gem -->
  <circle cx="60" cy="76" r="4.5" fill="url(#emerald-grad)" />
  
  <!-- Horizontal Horizon Accent Bars -->
  <line x1="44" y1="47" x2="76" y2="47" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <line x1="48" y1="56" x2="72" y2="56" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
