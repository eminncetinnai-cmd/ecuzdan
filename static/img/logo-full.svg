<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <!-- Metallic Violet to Indigo Gradient -->
    <linearGradient id="lf-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="lf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Gradient -->
    <linearGradient id="lf-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="lf-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(10, 10) scale(0.5)">
    <!-- Master Outer Hexagon-Squircle -->
    <rect x="15" y="15" width="90" height="90" rx="28" fill="url(#lf-primary)" />
    <rect x="15.5" y="15.5" width="89" height="89" rx="27.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />

    <!-- Inner Core -->
    <path d="M 28 42 C 28 32, 38 24, 60 24 C 82 24, 92 32, 92 42 L 92 78 C 92 88, 82 96, 60 96 C 38 96, 28 88, 28 78 Z" fill="#0b0f19" opacity="0.88" />
    <path d="M 38 48 C 38 40, 48 35, 60 35 C 72 35, 82 40, 82 48 C 82 58, 60 62, 60 74" fill="none" stroke="url(#lf-gold)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="60" cy="76" r="4.5" fill="url(#lf-emerald)" />
    <line x1="44" y1="47" x2="76" y2="47" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="48" y1="56" x2="72" y2="56" stroke="url(#lf-gold)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: E-CÜZDAN -->
  <text x="82" y="44" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.03em" fill="url(#lf-text-grad)">E-CÜZDAN</text>
  
  <!-- Subtitle: WEALTH & INTELLIGENCE -->
  <text x="84" y="60" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="0.28em" fill="#818cf8">INTELLIGENT WEALTH</text>
  
  <!-- Subtle Badge Gem -->
  <circle cx="280" cy="36" r="3" fill="#10b981" />
  <text x="288" y="39" font-family="'Outfit', sans-serif" font-size="8" font-weight="800" letter-spacing="0.15em" fill="#10b981">PRO</text>
</svg>
