# Dev-only observability stack (Faz 4A)
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#   Jaeger UI: http://localhost:16686
#
# Then in .env:
#   OTEL_ENABLED=true
#   OTEL_EXPORTER_OTLP_ENDPOINT=localhost:4317

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: e-cuzdan-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: e-cuzdan-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC — app sends traces here
    depends_on:
      - jaeger
    networks:
      - observability

networks:
  observability:
    driver: bridge
